name: Cleanup untagged package versions

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete untagged image versions
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      # This action is not manifest-aware: it deletes ANY untagged version,
      # including child manifests still referenced by a tagged OCI index.
      # That is only safe because docker.yml builds with provenance/SBOM
      # disabled, so tags are single manifests with no untagged children.
      # Do not re-enable provenance without replacing this cleanup with a
      # manifest-aware one.
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: myinfrawiki
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
